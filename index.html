:root {
  --mars-orange: #FF5600;
  --mars-rust: #963821;
  --mars-ink: #323232;
  --mars-graphite: #595959;
  --mars-silver: #C0C0C0;
  --bone: #F4EFE6;
  --bone-stroke: #E0D9CB;
  --font-display: 'Fold Grotesque Pro', 'Inter', system-ui, sans-serif;
  --font-mono: 'Martian Mono', ui-monospace, monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bone); overflow-x: hidden; }
body { font-family: var(--font-display); -webkit-font-smoothing: antialiased; }

/* ══════════════════════════════════════════
   DESKTOP — targeted at ~1200px Notion width
   on a 15" laptop
   ══════════════════════════════════════════ */

/* Single top header bar */
.desktop-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 36px 20px 36px;
  border-bottom: 1.5px solid var(--bone-stroke);
}
.desktop-header-left {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mars-graphite);
  display: flex;
  align-items: center;
  gap: 10px;
}
.desktop-header-rule {
  width: 24px;
  height: 1px;
  background: var(--mars-silver);
}
.desktop-header-right {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mars-rust);
}

/* Four-column row */
.desktop-banner {
  display: flex;
  width: 100%;
}

.desktop-card {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bone);
  position: relative;
  overflow: hidden;
  border-right: 1.5px solid var(--bone-stroke);
}
.desktop-card:last-child { border-right: none; }

.desktop-card > * { position: relative; z-index: 2; }

/* Card number block */
.d-number {
  padding: 20px 28px 18px 28px;
  border-bottom: 1.5px solid var(--bone-stroke);
}
.d-rock-label {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mars-ink);
  margin-bottom: 4px;
}
.d-numeral-row {
  display: flex;
  align-items: flex-start;
}
.d-numeral {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 72px;
  line-height: 0.82;
  letter-spacing: -0.05em;
  color: var(--mars-ink);
}
.d-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--mars-orange);
  align-self: flex-end;
  margin-bottom: 6px;
  margin-left: 4px;
  flex-shrink: 0;
}

/* Rock name */
.d-name {
  padding: 16px 28px 14px 28px;
}
.d-name-text {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 28px;
  line-height: 1.0;
  letter-spacing: -0.03em;
  color: var(--mars-ink);
  text-wrap: balance;
}

.d-spacer { flex: 1; }

/* Outcomes */
.d-outcomes {
  padding: 14px 28px 28px 28px;
  border-top: 1.5px solid var(--bone-stroke);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.d-outcomes-label {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mars-graphite);
}
.d-outcome-row {
  display: grid;
  grid-template-columns: 24px 1fr;
  column-gap: 8px;
  align-items: baseline;
}
.d-outcome-idx {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--mars-orange);
  padding-top: 2px;
}
.d-outcome-text {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 14px;
  line-height: 1.3;
  letter-spacing: -0.005em;
  color: var(--mars-ink);
}

/* ══════════════════════════════════════════
   MOBILE — swipe carousel, full card per rock
   ══════════════════════════════════════════ */

.mobile-wrapper { display: none; }
.carousel-dots { display: none; }

@media (max-width: 768px) {
  .desktop-header { display: none; }
  .desktop-banner { display: none; }
  .mobile-wrapper { display: block; }
  .carousel-dots { display: flex; }

  .mobile-carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .mobile-carousel::-webkit-scrollbar { display: none; }

  .mobile-card {
    flex: 0 0 100%;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    background: var(--bone);
    position: relative;
    overflow: hidden;
    min-height: calc(100vh - 50px);
    min-height: calc(100dvh - 50px);
  }

  /* Grain */
  .mobile-card::before {
    content: '';

  .mobile-card > * { position: relative; z-index: 2; }

  /* Mobile meta row — per card */
  .m-meta {
    padding: 32px 28px 0 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .m-meta-label {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mars-graphite);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .m-meta-rule {
    width: 20px;
    height: 1px;
    background: var(--mars-silver);
  }
  .m-meta-counter {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mars-rust);
  }

  .m-number {
    padding: 20px 28px 22px 28px;
    border-bottom: 1.5px solid var(--bone-stroke);
  }
  .m-rock-label {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mars-ink);
    margin-bottom: 6px;
  }
  .m-numeral-row {
    display: flex;
    align-items: flex-start;
  }
  .m-numeral {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 110px;
    line-height: 0.82;
    letter-spacing: -0.05em;
    color: var(--mars-ink);
  }
  .m-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--mars-orange);
    align-self: flex-end;
    margin-bottom: 10px;
    margin-left: 5px;
    flex-shrink: 0;
  }

  .m-name {
    padding: 22px 28px 18px 28px;
  }
  .m-name-text {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 44px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    color: var(--mars-ink);
    text-wrap: balance;
  }

  .m-spacer { flex: 1; }

  .m-outcomes {
    padding: 20px 28px 40px 28px;
    border-top: 1.5px solid var(--bone-stroke);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .m-outcomes-label {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mars-graphite);
  }
  .m-outcome-row {
    display: grid;
    grid-template-columns: 30px 1fr;
    column-gap: 10px;
    align-items: baseline;
  }
  .m-outcome-idx {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mars-orange);
    padding-top: 3px;
  }
  .m-outcome-text {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 20px;
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--mars-ink);
    text-wrap: pretty;
  }

  /* Dots */
  .carousel-dots {
    justify-content: center;
    gap: 10px;
    padding: 14px 0 22px;
    background: var(--bone);
  }
  .carousel-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--bone-stroke);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .carousel-dot.active {
    background: var(--mars-orange);
    transform: scale(1.25);
  }
}
</style>
</head>
<body>

<!-- ===== DESKTOP VIEW ===== -->
<div class="desktop-header">
  <div class="desktop-header-left">
    <span class="desktop-header-rule"></span>
    2026 · Company Rocks
  </div>
  <div class="desktop-header-right">4 Rocks</div>
</div>
<div class="desktop-banner" id="desktop-banner"></div>

<!-- ===== MOBILE VIEW ===== -->
<div class="mobile-wrapper">
  <div class="mobile-carousel" id="mobile-carousel"></div>
  <div class="carousel-dots" id="dots"></div>
</div>

<script>
const ROCKS = [
  { n:1, name:'Scale Profitable Subscriber Growth', bullets:['Acquire 10,000 net new subscribers per month','Scale YouTube, TikTok, X, Snap to 7.5k a day each','Maintain BAU NC ROAS of .50 + New Offer NC ROAS of .57','Maintain Payback period 3 months'] },
  { n:2, name:'Improve Subscriber Retention', bullets:['Improve Retention to 80%+ on M1 Rebill on Monthly Subscribers from 77.5% L6 Avg','Improve Retention to 70% on M3 Rebills for Quarterly Subscribers from 65.4% L6 Avg','Increase Portal Save Rate to 30%'] },
  { n:3, name:'Deploy AI Company-Wide', bullets:['Roll out Company-Wide Data Warehouse','Streamline Reporting for Each Department','Save 20% of time on output-driven roles (Creative, copywriting, design, editing)'] },
  { n:4, name:'Scale Ignite', bullets:['Scale to 500k a month MRR by end of Q4'] }
];

// Desktop cards
const dBanner = document.getElementById('desktop-banner');
ROCKS.forEach(r => {
  const nn = String(r.n).padStart(2,'0');
  const card = document.createElement('div');
  card.className = 'desktop-card';
  card.innerHTML = `
    <div class="d-number">
      <div class="d-rock-label">ROCK</div>
      <div class="d-numeral-row">
        <span class="d-numeral">${nn}</span>
        <span class="d-dot"></span>
      </div>
    </div>
    <div class="d-name">
      <div class="d-name-text">${r.name}</div>
    </div>
    <div class="d-spacer"></div>
    <div class="d-outcomes">
      <div class="d-outcomes-label">OUTCOMES</div>
      ${r.bullets.map((b,i) => `
        <div class="d-outcome-row">
          <span class="d-outcome-idx">0${i+1}</span>
          <div class="d-outcome-text">${b}</div>
        </div>
      `).join('')}
    </div>
  `;
  dBanner.appendChild(card);
});

// Mobile cards
const mCarousel = document.getElementById('mobile-carousel');
const dots = document.getElementById('dots');
ROCKS.forEach((r,i) => {
  const nn = String(r.n).padStart(2,'0');
  const card = document.createElement('div');
  card.className = 'mobile-card';
  card.innerHTML = `
    <div class="m-meta">
      <div class="m-meta-label"><span class="m-meta-rule"></span>2026 · COMPANY ROCK</div>
      <div class="m-meta-counter">${r.n} / 4</div>
    </div>
    <div class="m-number">
      <div class="m-rock-label">ROCK</div>
      <div class="m-numeral-row">
        <span class="m-numeral">${nn}</span>
        <span class="m-dot"></span>
      </div>
    </div>
    <div class="m-name">
      <div class="m-name-text">${r.name}</div>
    </div>
    <div class="m-spacer"></div>
    <div class="m-outcomes">
      <div class="m-outcomes-label">OUTCOMES</div>
      ${r.bullets.map((b,bi) => `
        <div class="m-outcome-row">
          <span class="m-outcome-idx">0${bi+1}</span>
          <div class="m-outcome-text">${b}</div>
        </div>
      `).join('')}
    </div>
  `;
  mCarousel.appendChild(card);

  const dot = document.createElement('button');
  dot.className = 'carousel-dot' + (i===0?' active':'');
  dot.setAttribute('aria-label','Go to Rock '+(i+1));
  dot.addEventListener('click', () => {
    mCarousel.scrollTo({ left: mCarousel.clientWidth * i, behavior: 'smooth' });
  });
  dots.appendChild(dot);
});

// Dot sync
let ticking = false;
mCarousel.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      const idx = Math.round(mCarousel.scrollLeft / mCarousel.clientWidth);
      document.querySelectorAll('.carousel-dot').forEach((d,i) => {
        d.classList.toggle('active', i===idx);
      });
      ticking = false;
    });
    ticking = true;
  }
});
</script>
</body>
</html>
